name: Denní scrape Heureky

# Projdou jen obchody, které mají vyplněný widget_key — ty se čtou přes
# oficiální widget Ověřeno zákazníky, který za Cloudflare není.
#
# Obchody bez klíče tady dostanou 403 (Cloudflare blokuje datacentrové IP)
# a zapíše se jim řádek s chybou. Ten ale přepíše první úspěšný scrape
# z kanceláře, takže data nekazí. Chybějící klíče doplní `npm run keys`
# nebo se berou z administrace Ověřeno zákazníky.

on:
  schedule:
    # Schválně mimo celou hodinu: GitHub naplánované běhy negarantuje a na
    # přelomu hodiny je největší nával, takže se odsouvají — a při velkém
    # zpoždění se běh i zahodí. Přesně to se stalo 6. 9. 2026, kdy cron
    # v "0 5" nespustil vůbec.
    #
    # Hlavní spouštěč je proto Vercel Cron (vercel.json); tenhle běh je
    # záloha. Oba zapisují stejný řádek, takže se nemůžou poprat.
    - cron: "41 4 * * *"
  workflow_dispatch:

concurrency:
  group: heureka-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Scrape a zápis do Google Sheetu
        run: npm run scrape:ci
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
