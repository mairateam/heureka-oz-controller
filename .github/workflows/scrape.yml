name: Scrape Heureky (ručně)

# POZOR: automatický denní běh je schválně vypnutý.
#
# Heureka je za Cloudflare, který blokuje datacentrové IP adresy. Z runnerů
# GitHub Actions dostane scrape 403 na všech obchodech, zatímco ze sítě
# kanceláře projde. Ověřeno 5. 9. 2026: 20 z 20 obchodů OK z lokálu,
# 0 z 20 z Actions o pár minut později.
#
# Denní scrape proto běží přes Plánovač úloh na firemním počítači
# (viz README, sekce "Automatický denní scrape").
#
# Workflow tu zůstává pro ruční spuštění — kdyby se blokace časem změnila,
# stačí odkomentovat blok `schedule` níže a ověřit jeden běh.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 5 * * *"

concurrency:
  group: heureka-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Scrape a zápis do Google Sheetu
        run: npm run scrape:ci
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
