name: Denní scrape Heureky

# Projdou jen obchody, které mají vyplněný widget_key — ty se čtou přes
# oficiální widget Ověřeno zákazníky, který za Cloudflare není.
#
# Obchody bez klíče tady dostanou 403 (Cloudflare blokuje datacentrové IP)
# a zapíše se jim řádek s chybou. Ten ale přepíše první úspěšný scrape
# z kanceláře, takže data nekazí. Chybějící klíče doplní `npm run keys`
# nebo se berou z administrace Ověřeno zákazníky.

on:
  schedule:
    # 5:00 UTC = 6:00 v zimě / 7:00 v létě. S rezervou před 9:00, kdy chodí
    # slackové hlášení — GitHub naplánované běhy při zátěži odsouvá.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: heureka-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Scrape a zápis do Google Sheetu
        run: npm run scrape:ci
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
